<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIは、どうやってことばを作るのか — LLMの仕組みと業界地図を3Dで</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070a14'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%234ecdc4' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23ffd166'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="LLMの仕組み、技術史、主要メーカーの系譜、画像・動画生成の原理、地域ごとの戦略、チャットとエージェントの違いを、スクロール連動の3Dで解説します。"
    />
  </head>
  <body>
    <canvas id="stage" aria-hidden="true"></canvas>
    <div id="fade" aria-hidden="true"></div>
    <div id="vignette" aria-hidden="true"></div>

    <div id="progress" aria-hidden="true"><i></i></div>

    <div id="controls">
      <button id="btn-mode" class="ctl" type="button" data-state="simple">
        <span class="ico">◐</span><span class="lbl">かんたん</span>
      </button>
      <div class="audio-group">
        <button id="btn-audio" class="ctl" type="button" data-state="off">
          <span class="ico">♪</span><span class="lbl">音声 OFF</span>
        </button>
        <button
          id="btn-voice"
          class="ctl ctl-icon"
          type="button"
          aria-label="声の設定"
          aria-expanded="false"
          title="声・速さ・高さを選ぶ"
        >
          ▾
        </button>

        <div id="voice-panel" hidden>
          <label class="vp-row">
            <span>声</span>
            <select id="voice-select"></select>
          </label>
          <label class="vp-row">
            <span>速さ</span>
            <input id="voice-rate" type="range" min="0.7" max="1.2" step="0.02" />
            <output id="voice-rate-out"></output>
          </label>
          <label class="vp-row">
            <span>高さ</span>
            <input id="voice-pitch" type="range" min="0.7" max="1.2" step="0.02" />
            <output id="voice-pitch-out"></output>
          </label>
          <div class="vp-actions">
            <button id="voice-preview" type="button">▶ 試聴</button>
            <button id="voice-reset" type="button">既定に戻す</button>
          </div>
        </div>
      </div>
    </div>

    <nav id="chapnav" aria-label="章の移動"></nav>

    <div id="subtitle" aria-live="polite"><p></p></div>

    <main id="doc"></main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
